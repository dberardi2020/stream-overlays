<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sim overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Transparent everywhere - OBS composites the page over your scene. Never paint
   an opaque background on html/body or the overlay stops being see-through. */
html,body{margin:0;padding:0;background:transparent;overflow:hidden}
body{font-family:"IBM Plex Mono",ui-monospace,monospace;color:#eceae5;-webkit-font-smoothing:antialiased}
canvas.ov{display:block}

/* Two layouts, so the setup UI never sits on top of the overlay:
   - Setup (default): caption + calibration panel stack at the top and the overlay
     sits BELOW them in normal flow.
   - Live (body.live): the setup UI is hidden and the overlay is pinned to the
     top-left of a transparent page - exactly what OBS should capture. */
#setup{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:12px}
#stage{margin:12px}
#cap{
  font-size:11px;color:#878d9a;background:rgba(10,11,14,0.86);
  border:1px solid #2e323c;border-radius:8px;padding:6px 9px;max-width:340px;line-height:1.45;
}
#cap b{color:#eceae5;font-weight:600}
#cap.err{color:#f2a5a0;border-color:#5a2b28}
body.live #setup{display:none}
body.live #stage{position:fixed;top:0;left:0;margin:0}
</style>
</head>
<body>
<div id="setup">
  <div id="cap"></div>
  <div id="calmount"></div>
</div>

<div id="stage"><canvas id="cv" class="ov"></canvas></div>

<script type="module">
import { createState } from "../engine/state.js";
import { pushHistory } from "../engine/draw-kit.js";
import { createCalibration } from "../engine/calibration.js";
import { readParams, resolveEntry, hexToRgba } from "../engine/url-config.js";

const capEl = document.getElementById("cap");
const fail = msg => { capEl.className = "err"; capEl.innerHTML = msg; };

/* ---- resolve the chosen overlay from the URL against the manifest ---- */
const params = readParams();

let manifest;
try {
  manifest = await fetch("../catalogue.json").then(r => r.json());
} catch (e) {
  fail("Could not load <b>catalogue.json</b>. Serve this over http (e.g. " +
       "<b>python&nbsp;-m&nbsp;http.server</b>) — file:// blocks fetch and ES modules.");
  throw e;
}

const entry = resolveEntry(manifest, params.style);
if (!entry) {
  fail("Unknown overlay <b>?style=" + (params.style || "(none)") + "</b>. " +
       "Pass a valid id, e.g. <b>?style=bowtie</b>.");
  throw new Error("no manifest entry for " + params.style);
}

/* ---- load the overlay module (dynamic import keeps the page static) ---- */
let mod;
try {
  mod = await import(`../overlays/${entry.id}.js`);
  if (typeof mod.draw !== "function") throw new Error("module exports no draw()");
} catch (e) {
  fail("<b>" + entry.name + "</b> is in the catalogue but not yet migrated to a " +
       "module (this is a pilot — only a few overlays are live). See ticket SO-0001.");
  throw e;
}

/* ---- canvas sizing (from the manifest, the source of truth for size) ---- */
const stage  = document.getElementById("stage");
const canvas = document.getElementById("cv");
const ctx = canvas.getContext("2d");
const dpr = window.devicePixelRatio || 1;
const W = entry.size.w, H = entry.size.h, scale = params.scale;
canvas.style.width  = (W * scale) + "px";
canvas.style.height = (H * scale) + "px";
canvas.width  = Math.round(W * scale * dpr);
canvas.height = Math.round(H * scale * dpr);
ctx.scale(scale * dpr, scale * dpr);

if (params.bgA > 0) {
  stage.style.background = hexToRgba(params.bgHex, params.bgA);
  stage.style.borderRadius = params.radius + "px";
  canvas.style.borderRadius = params.radius + "px";
}

/* ---- state + calibration ---- */
const state = createState();

capEl.innerHTML =
  "<b>" + entry.name + "</b><br>" +
  "OBS source size: <b>" + Math.round(W * scale) + "×" + Math.round(H * scale) + "px</b>" +
  (params.bgA > 0 ? " · plate #" + String(params.bgHex).replace("#", "") + " @ " + params.bgA : " · no plate") + "<br>" +
  "In OBS: right-click this source → <b>Interact</b>, press a wheel button, then calibrate. " +
  "Press <b>c</b> to re-calibrate.";

const cal = createCalibration({
  state,
  mount: document.getElementById("calmount"),
  storeKey: "g923.calibration.v2"
});

// Press "c" in the OBS Interact window to (re)calibrate at any time.
window.addEventListener("keydown", e => { if (e.key === "c" || e.key === "C") cal.calibrateAll(); });

/* ---- render loop: one overlay, live data only ---- */
const mem = {};
function frame() {
  cal.poll();

  // This is the LIVE overlay: never show fake data here. Until the wheel is
  // connected in OBS (Interact → press a wheel button → calibrate) it rests at
  // zero. The demo lap lives in the gallery, for choosing a style.
  if (!cal.isLive()) { state.thr = 0; state.brk = 0; state.clu = 0; state.str = 0; }

  document.body.classList.toggle("live", cal.isLive() && !cal.isCalibrating());
  pushHistory(state);

  ctx.clearRect(0, 0, W, H);
  ctx.save();
  mod.draw(ctx, W, H, state, mem);
  ctx.restore();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QA render</title>
<link href="./fonts/fonts.css" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:transparent}canvas{display:block}</style>
</head>
<body>
<canvas id="cv"></canvas>
<!--
  Deterministic single-overlay render for the acceptance harness (qa/acceptance.mjs).
  ?style=<id> imports the module, seeds a fixed state + history, draws exactly one
  frame, then sets data-rendered so the harness knows to screenshot. No animation,
  no wheel — every field the combo/telemetry overlays read is present on the single
  state object `s`, matching the contract (see qa/product-map.md).
-->
<script type="module">
import { hist, shiftLog, shiftTimes, gateUse, clock, tel } from "../overlays/sim-racing/engine/draw-kit.js";

function fail(msg) { document.documentElement.dataset.error = msg; throw new Error(msg); }

const params = new URLSearchParams(location.search);
const id = params.get("style");
const SCALE = 2;                          // must match qa/capture-golden.mjs

const manifest = await fetch("../overlays/sim-racing/catalogue.json").then(r => r.json()).catch(() => fail("no manifest"));
const entry = manifest.find(e => e.id === id) || fail("no manifest entry for " + id);

// The SAME frozen state the goldens were captured at (qa/fixture.json), so a pixel
// diff isolates to the draw code, not to different inputs. Populate every shared
// engine accumulator the shifter/combo overlays read.
const fixture = await fetch("./fixture.json").then(r => r.json()).catch(() => fail("no fixture.json — run capture-golden first"));
const state = { ...fixture.input, real: true };
for (const k of Object.keys(hist)) delete hist[k];
for (const [k, arr] of Object.entries(fixture.hist)) hist[k] = arr.slice();
shiftLog.length = 0; shiftLog.push(...fixture.shiftLog);
shiftTimes.length = 0; shiftTimes.push(...fixture.shiftTimes);
for (const k of Object.keys(gateUse)) delete gateUse[k];
Object.assign(gateUse, fixture.gateUse);
clock.t = fixture.clock.t; clock.lapTime = fixture.clock.lapTime;
Object.assign(tel, fixture.tel);

let mod;
try { mod = await import(`../overlays/sim-racing/overlays/${id}.js`); }
catch (e) { fail("import failed: " + e.message); }
if (typeof mod.draw !== "function") fail("no draw()");

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
cv.width = entry.size.w * SCALE;
cv.height = entry.size.h * SCALE;
cv.style.width = entry.size.w * SCALE + "px";
cv.style.height = entry.size.h * SCALE + "px";
ctx.scale(SCALE, SCALE);

/* Load the faces the draw code uses, then VERIFY.
   `await document.fonts.ready` alone was a no-op here and silently corrupted
   every golden: nothing had requested these families yet, so there were zero
   pending loads, it resolved instantly, and canvas painted with the OS fallback —
   baking whichever mono the capturing machine happened to have into the baseline
   (SO-0034). Webfonts load lazily; they must be asked for by name.

   The check is the important half. A golden captured in the wrong font still
   looks fine — it just fails on someone else's machine, months later. Failing
   here makes that impossible. */
const FACES = [
  "400 16px 'IBM Plex Mono'", "500 16px 'IBM Plex Mono'", "600 16px 'IBM Plex Mono'",
  "400 16px Oxanium",         "600 16px Oxanium",         "800 16px Oxanium"
];
await Promise.all(FACES.map(f => document.fonts.load(f)));
await document.fonts.ready;
const missing = FACES.filter(f => !document.fonts.check(f));
if (missing.length) fail("fonts did not load: " + missing.join(", ") +
  " — goldens must never be captured in a fallback (see qa/fonts/README.md)");
ctx.clearRect(0, 0, entry.size.w, entry.size.h);
mod.draw(ctx, entry.size.w, entry.size.h, state, {});
document.documentElement.dataset.rendered = "1";
</script>
</body>
</html>

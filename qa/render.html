<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QA render</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:transparent}canvas{display:block}</style>
</head>
<body>
<canvas id="cv"></canvas>
<!--
  Deterministic single-overlay render for the acceptance harness (qa/acceptance.mjs).
  ?style=<id> imports the module, seeds a fixed state + history, draws exactly one
  frame, then sets data-rendered so the harness knows to screenshot. No animation,
  no wheel — every field the combo/telemetry overlays read is present on the single
  state object `s`, matching the contract (see qa/product-map.md).
-->
<script type="module">
import { hist } from "../overlays/sim-racing/engine/draw-kit.js";

function fail(msg) { document.documentElement.dataset.error = msg; throw new Error(msg); }

const params = new URLSearchParams(location.search);
const id = params.get("style");
const SCALE = 2;                          // must match qa/capture-golden.mjs

const manifest = await fetch("../overlays/sim-racing/catalogue.json").then(r => r.json()).catch(() => fail("no manifest"));
const entry = manifest.find(e => e.id === id) || fail("no manifest entry for " + id);

// The SAME frozen state the goldens were captured at (qa/fixture.json), so a pixel
// diff isolates to the draw code, not to different inputs.
const fixture = await fetch("./fixture.json").then(r => r.json()).catch(() => fail("no fixture.json — run capture-golden first"));
const state = { ...fixture.input, real: true };
for (const k of Object.keys(hist)) delete hist[k];
for (const [k, arr] of Object.entries(fixture.hist)) hist[k] = arr.slice();

let mod;
try { mod = await import(`../overlays/sim-racing/overlays/${id}.js`); }
catch (e) { fail("import failed: " + e.message); }
if (typeof mod.draw !== "function") fail("no draw()");

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
cv.width = entry.size.w * SCALE;
cv.height = entry.size.h * SCALE;
cv.style.width = entry.size.w * SCALE + "px";
cv.style.height = entry.size.h * SCALE + "px";
ctx.scale(SCALE, SCALE);

await document.fonts.ready;               // render with the real font, not a fallback
ctx.clearRect(0, 0, entry.size.w, entry.size.h);
mod.draw(ctx, entry.size.w, entry.size.h, state, {});
document.documentElement.dataset.rendered = "1";
</script>
</body>
</html>
